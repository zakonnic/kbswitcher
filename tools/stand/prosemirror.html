<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stand:</title>
<style>
  body { font: 18px sans-serif; margin: 24px; }
  #editor { border: 1px solid #888; min-height: 120px; padding: 8px; white-space: pre-wrap; }
  .ProseMirror { outline: none; }
</style>
</head>
<body>
<p>ProseMirror editor for tools/stand: its text is mirrored into the window title.</p>
<div id="editor"></div>
<script type="module">
// Needs the network: ProseMirror comes from esm.sh, one build pinning the
// shared prosemirror-model so that the packages agree.
const deps = "?deps=prosemirror-model@1.25.1,prosemirror-state@1.4.3,prosemirror-transform@1.10.4,prosemirror-view@1.38.1";
const {EditorState} = await import("https://esm.sh/prosemirror-state@1.4.3" + deps);
const {EditorView} = await import("https://esm.sh/prosemirror-view@1.38.1" + deps);
const {schema} = await import("https://esm.sh/prosemirror-schema-basic@1.2.4" + deps);
const {keymap} = await import("https://esm.sh/prosemirror-keymap@1.2.2" + deps);
const {baseKeymap} = await import("https://esm.sh/prosemirror-commands@1.7.1" + deps);
const {history, undo, redo} = await import("https://esm.sh/prosemirror-history@1.4.1" + deps);

const view = new EditorView(document.querySelector("#editor"), {
  state: EditorState.create({schema, plugins: [history(), keymap({"Mod-z": undo, "Mod-y": redo}), keymap(baseKeymap)]}),
  dispatchTransaction(tr) {
    view.updateState(view.state.apply(tr));
    document.title = "stand:" + view.state.doc.textContent;
  },
});
view.focus();
document.title = "stand:";

// ?load=N keeps the main thread busy in bursts of about N ms, as a heavy
// application does: the editor then learns of a new selection late.
const load = Number(new URLSearchParams(location.search).get("load")) || 0;
if (load) {
  setInterval(() => {
    const end = performance.now() + load * (0.5 + Math.random());
    while (performance.now() < end);
  }, load);
}
</script>
</body>
</html>
